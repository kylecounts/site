<style>
  :root{
    --bg: #171614;
    --panel: #1e1c19;
    --ink: #eae6de;
    --ink-dim: #a8a29a;
    --line: #37342f;
    --accent: #b7996b;
    --focus: #d8c39c;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
  }

  .wrap{
    width: 100%;
    max-width: 780px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 56px;
    align-items: center;
  }

  .portrait{
    width: 220px;
    height: 220px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .portrait img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(28%) contrast(1.02);
  }

  .content{
    min-width: 0;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 450;
    font-size: clamp(2.25rem, 4.4vw, 3.1rem);
    line-height: 1.05;
    margin: 0 0 14px 0;
    letter-spacing: -0.01em;
  }

  .locale{
    font-size: 0.98rem;
    color: var(--ink-dim);
    margin: 0 0 26px 0;
  }

  .rule{
    width: 40px;
    height: 1px;
    background: var(--line);
    margin: 0 0 26px 0;
  }

  .links{
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px 22px;
    margin-bottom: 6px;
  }

  a.link-line{
    color: var(--ink);
    text-decoration: none;
    font-size: 0.98rem;
    border-bottom: 1px solid var(--line);
    width: fit-content;
    padding-bottom: 1px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  a.link-line:hover, a.link-line:focus-visible{
    border-color: var(--accent);
    color: var(--focus);
  }

  a.link-line:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  button.link-line{
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.98rem;
    padding: 0 0 1px 0;
    cursor: pointer;
    width: fit-content;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  button.link-line:hover, button.link-line:focus-visible{
    border-color: var(--accent);
    color: var(--focus);
  }

  button.link-line:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  /* Contact panel */
  #contact-panel{
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition: grid-template-rows 0.32s ease, opacity 0.28s ease;
    margin-top: 0;
  }

  #contact-panel.open{
    grid-template-rows: 1fr;
    opacity: 1;
    margin-top: 22px;
  }

  #contact-panel > div{
    overflow: hidden;
  }

  form{
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 4px;
    max-width: 380px;
  }

  label{
    font-size: 0.82rem;
    color: var(--ink-dim);
  }

  input, textarea{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.94rem;
    padding: 9px 10px;
    border-radius: 3px;
    width: 100%;
    resize: vertical;
  }

  input:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  textarea{ min-height: 96px; }

  .field{
    display:flex;
    flex-direction: column;
    gap: 5px;
  }

  .send-btn{
    margin-top: 4px;
    align-self: flex-start;
    background: var(--accent);
    color: #1a1815;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.92rem;
    padding: 9px 18px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .send-btn:hover{ background: var(--focus); }

  .send-btn:focus-visible{
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .form-note{
    font-size: 0.78rem;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  @media (max-width: 620px){
    .wrap{
      grid-template-columns: 1fr;
      gap: 28px;
      text-align: left;
    }
    .portrait{
      width: 148px;
      height: 148px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    #contact-panel, .send-btn, a.link-line, button.link-line{
      transition: none;
    }
  }
</style>
